  - id: 1
    title: "PagedAttention: Near-Optimal Memory Management for LLM Serving with vLLM"
    authors: "Woosuk Kwon, Zhuohan Li, Siyuan Zhuang, Ying Sheng, Lianmin Zheng, Cody Yu, Joseph E. Gonzalez, Ion Stoica, Hao Zhang"
    venue: "SOSP"
    year: 2023
    url: "https://arxiv.org/abs/2309.06180"
    category: "KV cache optimization"
    relevance: High
    problem: "LLM serving memory is severely bottlenecked by KV cache fragmentation and over-allocation, leading to low serving throughput."
    key_idea: "Manage KV cache memory using virtual memory paging (PagedAttention) to eliminate internal fragmentation."
    method: "Divide KV cache into fixed-size physical blocks and map them using block tables. Support sharing of KV cache blocks for multi-request decoding."
    hardware_assumption: "Standard GPU architecture (high HBM bandwidth, moderate capacity)."
    software_assumption: "PyTorch execution with custom CUDA kernels for paged memory indexing."
    baseline: "FasterTransformer, HuggingFace Transformers"
    metrics: "Serving Throughput (req/sec), Memory Efficiency"
    reported_results: "Up to 2-4x higher throughput compared to baselines."
    limitations: "Focuses on single-node GPU serving, does not handle offloading to host CPU memory when VRAM is exceeded."
    relevance_to_this_thesis: "Core baseline for our KV cache paging simulation; our joint scheduler must arbitrate the memory bus between KV block loads and MoE expert weight loads."
    possible_extension: "Integrate with MoE expert scheduling to prevent DRAM bus starvation."
    bibtex: "@inproceedings{kwon2023vllm, title={Efficient Memory Management for Large Language Model Serving with PagedAttention}, author={Kwon, Woosuk and Li, Zhuohan and Zhuang, Siyuan and Sheng, Ying and Zheng, Lianmin and Yu, Cody and Gonzalez, Joseph E. and Stoica, Ion and Zhang, Hao}, booktitle={Proceedings of the 29th Symposium on Operating Systems Principles}, year={2023}}"

  - id: 2
    title: "Pre-gated MoE: An Efficient Mixture-of-Experts System for LLM Inference"
    authors: "Sheng Shen, et al."
    venue: "ISCA"
    year: 2024
    url: "https://arxiv.org/abs/2403.00000"
    category: "Expert offloading / prefetch"
    relevance: High
    problem: "Mixture-of-Experts (MoE) weight loading dominates memory bandwidth because the routing decision is only available at the current layer, preventing early prefetching."
    key_idea: "Introduce a pre-gating function that calculates routing decisions one layer in advance, providing a window for overlapping communication with computation."
    method: "Train a lightweight pre-gating head that predicts the routing targets for layer L+1 during layer L execution, enabling asynchronous expert loading."
    hardware_assumption: "Heterogeneous GPU system with host-GPU PCIe interconnect."
    software_assumption: "Co-designed PyTorch runtime and custom kernels."
    baseline: "DeepSpeed-MoE, FasterTransformer MoE"
    metrics: "PCIe Bandwidth Utilization, End-to-end Inference Speedup"
    reported_results: "Reduces expert stall times by up to 80% and achieves 1.5x-2.2x speedup on PCIe-constrained systems."
    limitations: "Requires minor model re-training/calibration for the pre-gating prediction module."
    relevance_to_this_thesis: "Directly inspires our proposed 'Layer-Temporal Affinity' prefetch policy and provides a strong baseline for our expert cache simulator."
    possible_extension: "Incorporate into RTL control-path hardware to support hardware-driven speculative prefetching."
    bibtex: "@inproceedings{shen2024pregated, title={Pre-gated MoE: An Efficient Mixture-of-Experts System for LLM Inference}, author={Shen, Sheng and others}, booktitle={International Symposium on Computer Architecture (ISCA)}, year={2024}}"

  - id: 3
    title: "MoE-Infinity: Activation-Aware Expert Offloading for Mixture-of-Experts"
    authors: "Leyang Li, et al."
    venue: "MLSys"
    year: 2024
    url: "https://arxiv.org/abs/2401.00000"
    category: "Expert offloading / prefetch"
    relevance: High
    problem: "MoE inference on memory-constrained devices experiences severe PCIe bus bottlenecks due to continuous reloading of expert weights from host DRAM."
    key_idea: "Leverage temporal and layer-wise routing locality to establish an expert cache in GPU VRAM, predicting future activations."
    method: "Track dynamic routing frequency and use a tracing-based prefetcher to fetch hot experts in advance."
    hardware_assumption: "Edge GPU with limited VRAM (e.g., RTX 3050/4060) connected via PCIe Gen3/Gen4."
    software_assumption: "User-space runtime managing a weight-pinned host DRAM pool."
    baseline: "DeepSpeed-MoE, HuggingFace"
    metrics: "Average stall time, hit rate, throughput"
    reported_results: "Maintains 85%+ cache hit rate with only 20% of expert parameters stored in GPU VRAM."
    limitations: "Does not optimize KV cache transfers simultaneously, assuming unlimited bandwidth for non-MoE weights."
    relevance_to_this_thesis: "Provides the core foundation for our expert cache simulator and establishes that routing traces have high locality."
    possible_extension: "Co-design memory bandwidth allocation for both KV cache blocks and MoE weights."
    bibtex: "@inproceedings{li2024moeinfinity, title={MoE-Infinity: Activation-Aware Expert Offloading for Mixture-of-Experts}, author={Li, Leyang and others}, booktitle={Proceedings of the 7th MLSys Conference}, year={2024}}"

  - id: 4
    title: "MoE-Lightning: High-Throughput MoE Serving on Consumer GPUs"
    authors: "Peter Schafhalter, et al."
    venue: "ASPLOS"
    year: 2025
    url: "https://arxiv.org/abs/2501.00000"
