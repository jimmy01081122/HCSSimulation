  - id: 5
    title: "EdgeMoE: Fast Mixture-of-Experts Inference on Memory-Constrained Edge Devices"
    authors: "Fangkai Yang, et al."
    venue: "MobiCom"
    year: 2024
    url: "https://arxiv.org/abs/2308.14352"
    category: "Expert offloading / prefetch"
    relevance: Medium
    problem: "MoE LLM serving on edge devices (like Jetson Orin) fails due to severe memory capacity constraints."
