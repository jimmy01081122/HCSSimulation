definitions:
  high_level_scheduler_deadline_miss_ratio: "Coarse-grained packet-level deadline miss ratio estimated in the high-level token-layer simulator."
  request_level_deadline_miss_ratio: "Ratio of deadline-constrained demand requests (loads) that expire before service in the queue."
  packet_level_deadline_miss_ratio: "Equivalent to request-level deadline miss ratio in the cycle-accurate hardware queue."
  late_cycle_ratio: "Ratio of cycles where at least one request is late in the queue to total execution cycles."

